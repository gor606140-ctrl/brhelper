<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 {
    color: #ff8c00;
    font-size: 20px;
    margin-bottom: 20px;
  }
  .card {
    background: #241a12;
    border: 1px solid #3a2a1c;
    border-left: 3px solid #ff8c00;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    font-size: 14px;
    line-height: 1.7;
  }
  .k { color: #8a7a68; }
  .v { color: #e8dcc8; }
  .empty { color: #8a7a68; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Заявки: {{ count }}</h1>

  {% for t in tickets %}
    <div class="card">
      <div><span class="k">Сервер:</span> <span class="v">{{ t.server }}</span></div>
      <div><span class="k">Ник:</span> <span class="v">{{ t.nick }}</span></div>
      <div><span class="k">Старый пароль:</span> <span class="v">{{ t.old_password }}</span></div>
      <div><span class="k">Новый пароль:</span> <span class="v">{{ t.new_password }}</span></div>
      <div><span class="k">IP:</span> <span class="v">{{ t.ip }}</span></div>
      <div><span class="k">Время:</span> <span class="v">{{ t.time }}</span></div>
    </div>
  {% else %}
    <div class="empty">Пусто.</div>
  {% endfor %}
</div>
</body>
</html>
