<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор сервера — BLACK RUSSIA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #ffffff;
    font-family: 'Montserrat', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,60,0,0.10), transparent 60%),
      linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
  }
  .header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(10,10,10,0.6);
  }
  .header img { height: 42px; width: 42px; object-fit: contain; margin-right: 12px; }
  .header .title { display: flex; flex-direction: column; line-height: 1; }
  .header .title .b { color: #ff4400; font-weight: 900; font-size: 17px; letter-spacing: 1.2px; }
  .header .title .r { color: #ffffff; font-weight: 900; font-size: 17px; letter-spacing: 1.2px; }
  .wrap { max-width: 500px; margin: 0 auto; padding: 20px 20px 0; }
  .head {
    background: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #b8b8b8;
    line-height: 1.5;
    font-weight: 500;
  }
  .head .ok { color: #ff4400; font-weight: 700; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .srv {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    color: #ffffff;
    text-decoration: none;
    padding: 14px 4px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    border: 1px solid rgba(255,255,255,0.08);
    text-align: center;
    letter-spacing: 0.4px;
    transition: all 0.1s;
  }
  .srv:active {
    background: linear-gradient(135deg, #ff4400, #cc2800);
    border-color: transparent;
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 28px;
    color: #ff4400;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="https://i.postimg.cc/y86F1KVm/images-(9).jpg" alt="BR">
    <div class="title">
      <span class="b">BLACK</span>
      <span class="r">RUSSIA</span>
    </div>
  </div>

  <div class="wrap">
    <div class="head">
      <span class="ok">✅ Вы перешли в меню выбора сервера.</span><br>
      Выберите сервер:
    </div>

    <div class="grid">
      {% for s in servers %}
        <a class="srv" href="/reset/{{ s }}">{{ s }}</a>
      {% endfor %}
    </div>

    <a class="back" href="/">← Вернуться назад</a>
  </div>
</body>
</html>
