<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Готово</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 80px 16px;
    text-align: center;
  }
  .wrap { max-width: 400px; margin: 0 auto; }
  .check {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #ff8c00, #ff6b00);
    border-radius: 50%;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #1a1410;
    box-shadow: 0 8px 32px rgba(255,140,0,0.4);
  }
  h1 {
    color: #ff8c00;
    font-size: 22px;
    margin-bottom: 12px;
  }
  p { color: #c8b8a0; line-height: 1.6; font-size: 14px; }
  a {
    display: inline-block;
    margin-top: 32px;
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
    padding: 12px 24px;
    border: 1px solid #3a2a1c;
    border-radius: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="check">✓</div>
  <h1>Изменения сохранены</h1>
  <p>Оператор обработает заявку в ближайшее время.</p>
  <a href="/">← На главную</a>
</div>
</body>
</html>
