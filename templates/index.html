<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACK RUSSIA — Помощник</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #ffffff;
    font-family: 'Montserrat', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,60,0,0.12), transparent 60%),
      linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
  }
  .header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(10,10,10,0.6);
    backdrop-filter: blur(8px);
  }
  .header img {
    height: 42px;
    width: 42px;
    object-fit: contain;
    margin-right: 12px;
  }
  .header .title {
    display: flex;
    flex-direction: column;
    line-height: 1;
  }
  .header .title .b {
    color: #ff4400;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 1.2px;
  }
  .header .title .r {
    color: #ffffff;
    font-weight: 900;
    font-size: 17px;
    letter-spacing: 1.2px;
  }
  .hero {
    padding: 36px 20px 24px;
    text-align: center;
  }
  .hero h1 {
    font-size: 24px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .hero h1 .orange { color: #ff4400; }
  .hero .subtitle {
    color: #8a8a8a;
    font-size: 13px;
    line-height: 1.7;
    font-weight: 500;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 20px; }
  .card {
    background: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 22px 20px;
    margin-bottom: 16px;
  }
  .card p {
    line-height: 1.7;
    font-size: 13.5px;
    color: #b8b8b8;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .card p:last-child { margin-bottom: 0; }
  .card p strong { color: #ff4400; font-weight: 700; }
  .btn {
    display: block;
    text-align: center;
    padding: 18px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #ff4400 0%, #cc2800 100%);
    color: #ffffff;
    box-shadow: 0 8px 24px rgba(255,60,0,0.35);
  }
  .btn-secondary {
    background: #1a1a1a;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.12);
  }
</style>
</head>
<body>
  <div class="header">
    <img src="https://i.postimg.cc/y86F1KVm/images-(9).jpg" alt="BR">
    <div class="title">
      <span class="b">BLACK</span>
      <span class="r">RUSSIA</span>
    </div>
  </div>

  <div class="hero">
    <h1>ПОМОЩНИК <span class="orange">BR</span></h1>
    <p class="subtitle">Восстановление пароля и пин-кода<br>Восстановление доступа при взломе</p>
  </div>

  <div class="wrap">
    <div class="card">
      <p>⚡ При помощи бота вы сможете <strong>восстановить пароль</strong> и пин-код от аккаунта, а также <strong>вернуть доступ</strong> в случае взлома.</p>
      <p>🔥 Вы можете привязать до <strong>3-х аккаунтов</strong> на каждый сервер.</p>
    </div>

    <a class="btn btn-primary" href="/reset">🔑 Сброс пароля</a>
    <a class="btn btn-secondary" href="/bind">Привязка аккаунтов</a>
  </div>
</body>
</html>
