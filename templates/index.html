<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Russia — Помощник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255,140,0,0.08), transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(255,60,0,0.06), transparent 40%);
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  .logo {
    text-align: center;
    margin-bottom: 24px;
  }
  .logo img {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid #ff8c00;
    box-shadow: 0 0 24px rgba(255,140,0,0.4);
  }
  .logo h1 {
    color: #ff8c00;
    font-size: 22px;
    margin-top: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card {
    background: #241a12;
    border: 1px solid #3a2a1c;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .card p {
    line-height: 1.6;
    font-size: 14px;
    color: #c8b8a0;
    margin-bottom: 12px;
  }
  .card p:last-child { margin-bottom: 0; }
  .btn {
    display: block;
    text-align: center;
    padding: 16px;
    border-radius: 14px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 12px;
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #ff8c00, #ff6b00);
    color: #1a1410;
    box-shadow: 0 4px 16px rgba(255,140,0,0.3);
  }
  .btn-secondary {
    background: #2e2218;
    color: #ff8c00;
    border: 1px solid #3a2a1c;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <img src="https://i.imgur.com/8Y6sQ7N.png" alt="BR" onerror="this.style.display='none'">
    <h1>Black Russia</h1>
  </div>

  <div class="card">
    <p>⚡ При помощи бота вы сможете восстановить пароль и пин-код от аккаунта, а также вернуть доступ в случае взлома.</p>
    <p>🔥 Вы можете привязать до 3-х аккаунтов на каждый сервер.</p>
  </div>

  <a class="btn btn-primary" href="/reset">🔑 Сброс пароля</a>
  <a class="btn btn-secondary" href="/bind">Привязка аккаунтов</a>
</div>
</body>
</html>
