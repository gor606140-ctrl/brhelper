<!DOCTYPE html>

<head>

  p { line-height:1.5; }

<body>
<div class="wrap">
  <h1>Помощник 👋</h1>

  <a class="btn" href="/reset">🔑 Сброс пароля</a>
  <a class="btn gray" href="/bind">Привязка аккаунтов</a>
