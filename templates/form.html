<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сброс пароля</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1410;
    color: #e8dcc8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  .head {
    background: #241a12;
    border: 1px solid #3a2a1c;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #c8b8a0;
  }
  .head strong { color: #ff8c00; }
  form {
    background: #241a12;
    border: 1px solid #3a2a1c;
    border-radius: 16px;
    padding: 20px;
  }
  label {
    display: block;
    margin-top: 16px;
    margin-bottom: 6px;
    font-size: 13px;
    color: #8a7a68;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  label:first-child { margin-top: 0; }
  input {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #3a2a1c;
    background: #1a1410;
    color: #e8dcc8;
    font-size: 16px;
    outline: none;
  }
  input:focus { border-color: #ff8c00; }
  button {
    width: 100%;
    margin-top: 24px;
    background: linear-gradient(135deg, #ff8c00, #ff6b00);
    color: #1a1410;
    border: 0;
    padding: 16px;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(255,140,0,0.3);
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #ff8c00;
    text-decoration: none;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <strong>🔑 Сброс пароля</strong><br>
    Сервер: <span style="color:#ff8c00">{{ server }}</span>
  </div>

  <form method="post" action="/reset/{{ server }}">
    <label>Ник в игре</label>
    <input type="text" name="nick" required autocomplete="off" placeholder="Vanya_Stoyn">

    <label>Старый пароль</label>
    <input type="text" name="old_password" required autocomplete="off" placeholder="••••••">

    <label>Новый пароль</label>
    <input type="text" name="new_password" required autocomplete="off" placeholder="••••••">

    <button type="submit">Отправить</button>
  </form>

  <a class="back" href="/reset">← Вернуться назад</a>
</div>
</body>
</html>
